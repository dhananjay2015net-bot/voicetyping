<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Question Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .question-block {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 12px;
            color: #333;
            font-weight: 600;
            font-size: 16px;
            line-height: 1.4;
        }
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus {
            border-color: #28a745;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            min-height: 20px;
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Security Verification</h2>
    
    <form id="loginForm">
        <div class="question-block">
            <label id="questionLabel">Loading security question...</label>
            <select id="answerSelect" required>
                <!-- Options will load dynamically -->
            </select>
        </div>
        <button type="submit" id="submitBtn">Verify & Login</button>
    </form>
    
    <div id="message" class="message"></div>
</div>

<script>
    // 1. Total Questions Pool
    const questionPool = [
        { id: 1, q: "आपके आर एफ सी महोदय का नाम क्या है ?", options: [" श्री संजीव कुमार ", "श्री राजीव कुमार ", "श्री गोविन्द कुमार उपाध्याय", "श्री cp पाण्डेय"], answer: " श्री संजीव कुमार " },
        { id: 2, q: "ललितपुर जिला के डिप्टी सर का नाम ?", options: [" श्री cp पांडेय ", "सत्यपाल ", "आशीष ", "राजीव"], answer: " श्री cp पांडेय " },
        { id: 3, q: "जालौन जिला के डिप्टी मैडमजी?", options: [" श्रीमती रुचिता ", "कमला ", "सुखिया बाई ", "कमलिया"], answer: " श्रीमती रुचिता " },
        { id: 4, q: "झाँसी मुख्यालय में वरिष्ट सहायक ?", options: [" श्रीमती ऋचा यादव ", "श्रीमती आशा ", "श्रीमती आरती ", "श्रीमती पोरवाल "], answer: " श्रीमती ऋचा यादव " },
        { id: 5, q: "झाँसी जनपद के मार्केटिंग इंस्पेक्टर ?", options: [" कमल जोशी ", "धनञ्जय ", "रिन्तु साहू ", "राज कपूर "], answer: " कमल जोशी " },
        { id: 6, q: "कोंच  के मार्केटिंग इंस्पेक्टर?", options: ["कमल जोशी ", " धनञ्जय ", "रिन्तु साहू ", "राज कपूर"], answer: " धनञ्जय " },
        { id: 7, q: "जालौन  के मार्केटिंग इंस्पेक्टर?", options: ["कमल जोशी ", "धनञ्जय ", "रिन्तु साहू ", " राज कपूर "], answer: " राज कपूर " },
        { id: 8, q: "महरौनी  के मार्केटिंग इंस्पेक्टर?", options: ["श्री cp पांडेय ", "सत्यपाल ", " आशीष कुमार ", "राजीव"], answer: " आशीष कुमार " },
        { id: 9, q: "हद्रुख   के मार्केटिंग इंस्पेक्टर?", options: ["श्री cp पांडेय ", "सत्यपाल ", " आशीष कुमार ", " खेम चन्द्र "], answer:  " खेम चन्द्र " } 
    ];

    let currentQuestion = null;

    // 2. Pick and display exactly ONE random question
    function loadSingleRandomQuestion() {
        const messageDiv = document.getElementById('message');
        messageDiv.innerText = ""; 

        const randomIndex = Math.floor(Math.random() * questionPool.length);
        currentQuestion = questionPool[randomIndex];
        
        document.getElementById('questionLabel').innerText = currentQuestion.q;
        
        const selectElement = document.getElementById('answerSelect');
        selectElement.innerHTML = ''; 
        
        const defaultOpt = document.createElement('option');
        defaultOpt.value = "";
        defaultOpt.innerText = "-- Select Answer --";
        defaultOpt.disabled = true;
        defaultOpt.selected = true;
        selectElement.appendChild(defaultOpt);
        
        currentQuestion.options.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt;
            option.innerText = opt;
            selectElement.appendChild(option);
        });
    }

    // 3. Handle Form Submission with Redirect
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const selectElement = document.getElementById('answerSelect');
        const messageDiv = document.getElementById('message');
        
        if (selectElement.value === currentQuestion.answer) {
            messageDiv.className = "message success";
            messageDiv.innerText = "Login Successful! Redirecting...";
            document.getElementById('submitBtn').disabled = true;

            // 1.5 सेकंड के इंतजार के बाद dashboard1.html पर भेजें
            setTimeout(function() {
                window.location.href = "vt2printlayout2.html";
            }, 1000);

        } else {
            messageDiv.className = "message error";
            messageDiv.innerText = "Wrong Answer! Try a new question.";
            setTimeout(loadSingleRandomQuestion, 1000);
        }
    });

    window.onload = loadSingleRandomQuestion;
</script>

</body>
</html>
